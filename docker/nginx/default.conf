map $http_x_forwarded_proto $imprefast_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $imprefast_forwarded_host {
    default $http_x_forwarded_host;
    "" $host;
}

server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 64M;

    error_page 413 /413.html;

    location = /413.html {
        internal;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $imprefast_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $imprefast_forwarded_host;
        fastcgi_pass imprefast-php:9000;
    }

    location ~ /\. {
        deny all;
    }
}
