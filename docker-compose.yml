services:
  app:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    env_file: .env
    volumes: ["private_files:/var/www/html/storage/app/private"]
    networks:
      default:
        aliases: [imprefast-php]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes: [".:/var/www/html:ro", "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"], interval: 10s, timeout: 3s, retries: 10}
  db:
    image: mariadb:11.4
    environment: {MARIADB_DATABASE: "${DB_DATABASE:-imprefast}", MARIADB_USER: "${DB_USERNAME:-imprefast}", MARIADB_PASSWORD: "${DB_PASSWORD:-secret}", MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"}
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    command: php artisan queue:work --queue=notifications,default --sleep=3 --tries=3 --timeout=90
    env_file: .env
    volumes: ["private_files:/var/www/html/storage/app/private"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  scheduler:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    command: php artisan schedule:work
    env_file: .env
    volumes: ["private_files:/var/www/html/storage/app/private"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
volumes: {db_data: {}, private_files: {}}
networks: {default: {name: imprefast_internal}}
